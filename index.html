 
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>1Shows TV</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    iframe {
      display: block;
      width: 100vw;
      height: 100dvh;
      border: none;
      background: #000;
    }
  </style>
</head>

<body>
  <iframe
    src="https://1shows.org"
    title="1Shows TV"
    allow="autoplay; fullscreen;
           encrypted-media; picture-in-picture"
    allowfullscreen
    referrerpolicy="no-referrer">
  </iframe>
</body>
</html>
